name: Shopify orders extraction

on:
  schedule:
    # Le 1er de chaque mois à 05:30 UTC (minuit 30 / 1h30 au Québec) : enregistre le mois
    # qui vient de se terminer (Shopify ne donne que 60 jours d'historique). Les 1er janvier,
    # avril, juillet et octobre, assemble aussi le trimestre et envoie les fichiers par courriel.
    # Premier lancement : 2026-11-01 (enregistre octobre 2026).
    - cron: "30 5 1 * *"
  workflow_dispatch:
    inputs:
      trimestre:
        description: "Trimestre : vide = dernier trimestre terminé, 'actuel' = trimestre en cours, ou ex. 2026-T3"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run extraction
        env:
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TRIMESTRE: ${{ inputs.trimestre }}
          EXTRACTION: ${{ github.event_name == 'schedule' && 'mensuel' || 'trimestre' }}
        run: python scripts/shopify_extract_orders.py

      - name: Commit and push extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/orders
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated Shopify orders extraction"
            git push
          fi
